<div class="success">
  <div class="container">
    <div class="success__card">
      <div class="success__icon">
        <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="26" cy="26" r="26" fill="var(--color-peach-light)" />
          <path
            d="M15 27l8 8 14-16"
            stroke="var(--color-peach)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <h1 class="success__title">Order confirmed!</h1>
      <p class="success__subtitle">
        Thank you for your purchase. A confirmation email is on its way to you
        now with your order details.
      </p>

      @if (sessionId) {
        <p class="success__ref">
          Order ref: <span>Order Reference Numba</span>
        </p>
      }

      <div class="success__actions">
        <a routerLink="/shop" class="btn btn--primary">Continue Shopping</a>
        <a routerLink="/" class="btn btn--ghost">Back to Home</a>
      </div>
    </div>
  </div>
</div>
