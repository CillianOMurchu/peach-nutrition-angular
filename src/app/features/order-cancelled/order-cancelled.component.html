<div class="cancelled">
  <div class="container">
    <div class="cancelled__card">

      <div class="cancelled__icon">
        <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="26" cy="26" r="26" fill="#fdf0eb" />
          <path
            d="M18 18l16 16M34 18L18 34"
            stroke="var(--color-peach)"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <h1 class="cancelled__title">Payment cancelled</h1>
      <p class="cancelled__subtitle">
        No charge has been made. Your cart is still saved — head back whenever
        you're ready.
      </p>

      <div class="cancelled__actions">
        <button class="btn btn--primary" (click)="returnToCart()">Return to Cart</button>
        <a routerLink="/" class="btn btn--ghost">Back to Home</a>
      </div>

    </div>
  </div>
</div>
