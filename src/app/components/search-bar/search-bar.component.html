<div class="search">
  <svg class="search__icon" viewBox="0 0 20 20" fill="none">
    <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
    <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round"/>
  </svg>

  <input
    class="search__input"
    type="search"
    placeholder="Search products..."
    [value]="value()"
    (input)="onInput($event)" />

  @if (value()) {
    <button class="search__clear" (click)="onClear()" aria-label="Clear search">
      ✕
    </button>
  }
</div>
