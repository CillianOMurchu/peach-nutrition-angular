<article
  class="card"
  [class.card--out-of-stock]="isOutOfStock()"
  [routerLink]="['/product', product().id]"
>
  <!-- Image area -->
  <div class="card__image-wrap">
    <!-- Badges top-left -->
    <div class="card__badges">
      <app-product-badges [product]="product()" />
    </div>

    <!-- Brand badge top-right -->
    <span class="badge badge--{{ product().brand }} card__brand">
      {{ product().brand }}
    </span>

    <img
      [src]="product().images[0].src"
      [alt]="product().images[0].alt"
      class="card__image"
      loading="lazy"
    />
  </div>

  <!-- Info area -->
  <div class="card__body">
    <!-- Stars + review count -->
    <div class="card__stars">
      @for (filled of stars(); track $index) {
        <span class="star" [class.star--filled]="filled">★</span>
      }
      <span class="card__review-count">({{ product().review.count }})</span>
    </div>

    <h3 class="card__name">{{ product().name }}</h3>

    <!-- Tags -->
    <app-tag-list [tags]="product().tags.slice(0, 3)" />

    <!-- Price row -->
    <div class="card__footer">
      <div class="card__pricing">
        @if (discountedPrice()) {
          <span class="card__price card__price--original">
            €{{ product().price.toFixed(2) }}
          </span>
          <span class="card__price card__price--discounted">
            €{{ discountedPrice()!.toFixed(2) }}
          </span>
        } @else {
          <span class="card__price">€{{ product().price.toFixed(2) }}</span>
        }
      </div>

      <button
        class="card__add-btn"
        [disabled]="isOutOfStock()"
        (click)="$event.stopPropagation(); cart.add(product())"
        aria-label="Add to cart"
      >
        +
      </button>
    </div>
  </div>
</article>
