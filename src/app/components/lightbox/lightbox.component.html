@if (open && images.length) {
  <div class="lightbox" (click)="closed.emit()">
    <button class="lightbox__close" (click)="closed.emit()" aria-label="Close">
      ✕
    </button>

    @if (images.length > 1) {
      <button
        class="lightbox__arrow lightbox__arrow--prev"
        (click)="$event.stopPropagation(); prev()"
        aria-label="Previous"
      >
        ‹
      </button>
    }

    <div class="lightbox__image-wrap" (click)="$event.stopPropagation()">
      <img
        [src]="images[index()].src"
        [alt]="images[index()].alt"
        class="lightbox__image"
      />
    </div>

    @if (images.length > 1) {
      <button
        class="lightbox__arrow lightbox__arrow--next"
        (click)="$event.stopPropagation(); next()"
        aria-label="Next"
      >
        ›
      </button>

      <div class="lightbox__dots">
        @for (img of images; track $index) {
          <button
            class="lightbox__dot"
            [class.lightbox__dot--active]="index() === $index"
            (click)="$event.stopPropagation(); index.set($index)"
            [attr.aria-label]="'View image ' + ($index + 1)"
          ></button>
        }
      </div>
    }
  </div>
}
